<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="DevPlay — comunidad de devs y betas">
  <title>DevPlay — Comunidad de devs y betas</title>
  <desc>Hero banner retro pixel, paleta cálida de DevPlay</desc>

  <defs>
    <!-- Fondo cálido con viñeta -->
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%"   stop-color="#3B2717"/>
      <stop offset="55%"  stop-color="#2A1A10"/>
      <stop offset="100%" stop-color="#1C120B"/>
    </radialGradient>

    <!-- Degradado del título (crema -> dorado -> terracota) -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F7E4B4"/>
      <stop offset="42%"  stop-color="#F0D9A8"/>
      <stop offset="72%"  stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#C2762F"/>
    </linearGradient>

    <!-- Degradado del degradado del botón/dock -->
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E08A52"/>
      <stop offset="100%" stop-color="#C05E2E"/>
    </linearGradient>

    <!-- Rejilla fina tipo papel/devo -->
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#EEE5D3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- Difuminado inferior para la cinta -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1C120B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12100C" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ══ Fondo ══ -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- ══ Chispas pixel (estrellitas del retro) ══ -->
  <g fill="#D9A441">
    <rect x="86"  y="72"  width="6" height="6"/>
    <rect x="92"  y="72"  width="6" height="6"/>
    <rect x="86"  y="78"  width="6" height="6"/>
    <rect x="98"  y="78"  width="6" height="6"/>
    <rect x="92"  y="84"  width="6" height="6"/>
    <rect x="1090" y="96" width="6" height="6"/>
    <rect x="1084" y="102" width="6" height="6"/>
    <rect x="1096" y="102" width="6" height="6"/>
    <rect x="1090" y="108" width="6" height="6"/>
  </g>
  <g fill="#DC7A44" opacity="0.85">
    <rect x="150" y="300" width="5" height="5"/>
    <rect x="156" y="306" width="5" height="5"/>
    <rect x="1044" y="286" width="5" height="5"/>
    <rect x="1038" y="292" width="5" height="5"/>
    <rect x="1044" y="298" width="5" height="5"/>
  </g>
  <g fill="#EEE5D3" opacity="0.30">
    <rect x="238" y="128" width="4" height="4"/>
    <rect x="962" y="150" width="4" height="4"/>
    <rect x="880" y="96"  width="4" height="4"/>
    <rect x="330" y="188" width="4" height="4"/>
  </g>

  <!-- ══ Mando de juegos pixel-art ══ -->
  <g transform="translate(84 128) scale(9)">
    <!-- resplandor -->
    <g fill="#DC7A44" opacity="0.22" filter="url(#softglow)">
      <rect x="1" y="2" width="16" height="6"/>
    </g>
    <!-- cuerpo -->
    <g fill="#F0D9A8">
      <!-- corona superior -->
      <rect x="6" y="0" width="6" height="1"/>
      <rect x="5" y="1" width="8" height="1"/>
      <!-- cuerpo principal -->
      <rect x="3" y="2" width="12" height="5"/>
      <rect x="2" y="3" width="14" height="4"/>
      <!-- grips -->
      <rect x="1" y="4" width="1"  height="3"/>
      <rect x="16" y="4" width="1" height="3"/>
      <rect x="0" y="5" width="1"  height="2"/>
      <rect x="17" y="5" width="1" height="2"/>
      <rect x="2" y="7" width="1"  height="1"/>
      <rect x="15" y="7" width="1" height="1"/>
      <rect x="3" y="8" width="2"  height="1"/>
      <rect x="13" y="8" width="2" height="1"/>
    </g>
    <!-- cruceta (d-pad) -->
    <g fill="#23160E">
      <rect x="4" y="3" width="1" height="3"/>
      <rect x="3" y="4" width="3" height="1"/>
    </g>
    <!-- botones A/B -->
    <g fill="#D9A441">
      <rect x="12" y="3" width="1" height="1"/>
      <rect x="14" y="4" width="1" height="1"/>
      <rect x="12" y="5" width="1" height="1"/>
      <rect x="13" y="3" width="1" height="1"/>
      <rect x="14" y="3" width="1" height="1"/>
    </g>
    <!-- start/select -->
    <g fill="#23160E" opacity="0.75">
      <rect x="8" y="4" width="1" height="1"/>
      <rect x="10" y="4" width="1" height="1"/>
    </g>
  </g>

  <!-- ══ Título ══ -->
  <text x="270" y="205"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="112" font-weight="700" letter-spacing="-2"
        fill="#12100C" opacity="0.55" transform="translate(5 6)">DEVPLAY</text>
  <text x="270" y="205"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="112" font-weight="700" letter-spacing="-2"
        fill="url(#gold)">DEVPLAY</text>

  <!-- filete ornamental bajo el título -->
  <rect x="272" y="232" width="120" height="3" fill="#D9A441"/>
  <rect x="400" y="232" width="34"  height="3" fill="#DC7A44" opacity="0.65"/>

  <!-- ══ Subtítulo ══ -->
  <text x="272" y="278"
        font-family="'Courier New', Consolas, monospace"
        font-size="21" letter-spacing="5.5" font-weight="700"
        fill="#EEE5D3" opacity="0.88">COMUNIDAD DE DEVS Y BETAS</text>

  <!-- ══ Chips de la cinta ══ -->
  <g transform="translate(272 306)">
    <rect x="0" y="0" width="176" height="34" rx="17" fill="#EEE5D3" fill-opacity="0.08"
          stroke="#D9A441" stroke-opacity="0.45"/>
    <text x="16" y="23" font-family="Georgia, serif" font-size="15" font-weight="700"
          letter-spacing="1.4" fill="#F6EFDE">★ EN DEVPLAY</text>
  </g>
  <g transform="translate(464 306)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#D9A441" fill-opacity="0.22"
          stroke="#D9A441" stroke-opacity="0.5"/>
    <text x="16" y="23" font-family="Georgia, serif" font-size="15" font-weight="700"
          letter-spacing="1.4" fill="#F0D9A8">v0.4.2</text>
  </g>
  <g transform="translate(600 306)">
    <rect x="0" y="0" width="152" height="34" rx="17" fill="#EEE5D3" fill-opacity="0.06"
          stroke="#EEE5D3" stroke-opacity="0.18"/>
    <text x="16" y="23" font-family="Georgia, serif" font-size="15" font-weight="700"
          letter-spacing="1.2" fill="#EEE5D3" opacity="0.85">Pixel Dash</text>
  </g>

  <!-- ══ Botón Crear ══ -->
  <g transform="translate(940 250)">
    <rect x="0" y="0" width="184" height="56" rx="28" fill="url(#ember)"
          stroke="#D9A441" stroke-opacity="0.55"/>
    <rect x="20" y="19" width="4" height="18" fill="#FFFFFF"/>
    <rect x="13" y="26" width="18" height="4" fill="#FFFFFF"/>
    <text x="46" y="36" font-family="Georgia, serif" font-size="21" font-weight="700"
          letter-spacing="0.6" fill="#FFFFFF">Crear</text>
  </g>

  <!-- ══ Marco editorial doble (como .frame-double de la web) ══ -->
  <rect x="10" y="10" width="1180" height="400" fill="none"
        stroke="#EEE5D3" stroke-opacity="0.16"/>
  <rect x="17" y="17" width="1166" height="386" fill="none"
        stroke="#EEE5D3" stroke-opacity="0.08"/>

  <!-- ══ Cinta inferior ══ -->
  <rect x="0" y="352" width="1200" height="68" fill="url(#fade)"/>
  <rect x="0" y="352" width="1200" height="3" fill="#D9A441" fill-opacity="0.35"/>
  <g font-family="'Courier New', Consolas, monospace" font-size="13" letter-spacing="2"
     fill="#EEE5D3" opacity="0.72">
    <text x="34"  y="382">PIXEL DASH  ·  ARCADE  ·  1.2k</text>
    <text x="330" y="382">NEON DRIFT  ·  CARRERAS  ·  3.4k</text>
    <text x="630" y="382">CÓDIGO ROJO  ·  SHOOTER  ·  912</text>
    <text x="910" y="382">ASTRO BAKERY  ·  SIMULACIÓN  ·  5.9k</text>
  </g>
</svg>